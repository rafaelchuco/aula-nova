name: Build and integration checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore demo10/demo10.csproj
      - run: dotnet build demo10/demo10.csproj --no-restore -c Release
      - run: python3 tests/smoke.py
